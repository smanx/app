<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenAI Token 消耗器</title>
<style>
body{margin:0;background:#f5f7fb;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;color:#1f2937}
.wrap{max-width:1200px;margin:0 auto;padding:18px 16px}
h1{margin:0 0 10px;font-size:24px}
.card{background:#fff;border:1px solid #dbe3ef;border-radius:10px;padding:18px 20px;margin-bottom:14px}
.g2,.g3,.stats,.logs{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));column-gap:22px;row-gap:16px}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));column-gap:22px;row-gap:16px}
label{display:flex;flex-direction:column;gap:7px;font-size:12px;color:#4b5563}input,textarea,select,button{font:inherit}input,textarea,select{margin-top:0;border:1px solid #cfd8e6;border-radius:7px;padding:10px 11px;background:#fff}input[type=checkbox]{width:auto;margin:0;accent-color:#2563eb}.toggle{display:flex;flex-direction:row;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:#374151}.toggle span{line-height:1.35}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{padding:8px 12px;border:0;border-radius:7px;cursor:pointer}.p{background:#2563eb;color:#fff}.d{background:#dc2626;color:#fff}.s{background:#fff;border:1px solid #cfd8e6}
button:disabled{opacity:.6;cursor:not-allowed}
#ms,#rs{font-size:12px;color:#6b7280}
.stats{grid-template-columns:repeat(6,minmax(80px,1fr))}
.box{border:1px solid #dbe3ef;border-radius:8px;background:#fbfdff;padding:8px}.box b{display:block;font-size:18px;margin-top:4px}
.logs{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.log{border:1px solid #dbe3ef;border-radius:8px;background:#fbfdff;padding:8px}.log.waiting{border-color:#d1d5db;background:#f9fafb}.log.running{border-color:#2563eb;border-width:2px;box-shadow:0 0 8px rgba(37,99,235,.3);background:#f0f7ff}.log.success{border-color:#16a34a;background:#f0fdf4}.log.done{border-color:#16a34a;border-style:dashed;background:#f0fdf4}.log.error{border-color:#dc2626;background:#fef2f2}.log.stopped{border-color:#d97706;background:#fffbeb}
.t{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.m{font-size:12px;color:#6b7280;margin-bottom:6px}
pre{margin:0;background:#0f172a;color:#dbeafe;border-radius:7px;padding:8px;min-height:120px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:12px}
@media (max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<h1>OpenAI Token 消耗器</h1>
<div class="card">
<div class="g2">
<label>Base URL<input id="base" value="https://api.openai.com" placeholder="https://api.openai.com 或代理地址/v1"></label>
<label>Token<input id="token" type="password" placeholder="sk-..."></label>
<label>Auto Model (Loaded)<input id="modelAuto" list="modelList" placeholder="Load models first"><datalist id="modelList"></datalist></label>
</div>
<div class="row"><label class="toggle" style="margin-top:0"><input id="tokenShow" type="checkbox"><span>Show Token</span></label><button class="s" id="load">Load Models</button><span id="ms">Enter baseurl + token to auto load models.</span></div>
</div>
<div class="card">
<label>System Prompt（可选）<textarea id="sys">You are a concise assistant.</textarea></label>
<label style="margin-top:8px">User Prompt<textarea id="usr" placeholder="输入要重复调用的内容">写一个1000字的小说</textarea></label><label class="toggle"><input id="randOn" type="checkbox"><span>添加随机标记</span></label><label class="toggle"><input id="streamOn" type="checkbox" checked><span>流式输出</span></label>
<div class="g3" style="margin-top:8px">
<label>每线程循环次数<input id="loop" type="number" min="1" value="10"></label>
<label>并发线程数<input id="thr" type="number" min="1" value="3"></label>
<label>max_tokens<input id="max" type="number" min="1" value="1024"></label>
<label>temperature<input id="temp" type="number" min="0" max="2" step="0.1" value="1"></label>
<label>单次超时秒数<input id="to" type="number" min="5" value="600"></label>
<label>目标输入/输出比例(开启添加随机标记才生效)<input id="ratioTarget" type="number" min="0.1" max="20" step="0.1" value="1.0"></label>
</div>
<div class="row"><button class="p" id="start">开始</button><button class="d" id="stop" disabled>停止</button><span id="rs">尚未开始</span></div>
</div>
<div class="card">
<div class="stats">
<div class="box">目标请求<b id="stt">0</b></div>
<div class="box">已完成<b id="std">0</b></div>
<div class="box">成功/失败/中止<b id="str">0/0/0</b></div>
<div class="box">累计 tokens<b id="stk">0</b></div>
<div class="box">输入/输出<b id="stp">0/0</b></div>
<div class="box">耗时<b id="sec">0s</b></div>
</div>
</div>
<div class="card"><div class="logs" id="logs"><div style="color:#6b7280">开始后生成线程日志（每线程仅保留最近一条）</div></div></div>
</div>
<script>
const $=id=>document.getElementById(id),S={run:false,stop:false,id:0,st:{t:0,d:0,s:0,f:0,a:0,p:0,c:0,k:0},views:new Map(),cs:new Set(),start:0,timer:0,ratio:{live:0,target:1,markerLen:24}};
const n=(v,d,min,max)=>{v=Number(v);if(!Number.isFinite(v))return d;return Math.min(max,Math.max(min,v))};
const api=(b,p)=>{b=b.trim().replace(/\/+$/,'');if(!b)throw Error('Base URL 不能为空');return(b.endsWith('/v1')?b:b+'/v1')+p};
const parse=t=>{try{return JSON.parse(t)}catch{return null}};
const txt=o=>{const c=o?.choices?.[0]?.message?.content;if(typeof c==='string')return c;if(Array.isArray(c))return c.map(x=>typeof x==='string'?x:(x?.text||JSON.stringify(x))).join('\\n');return c?JSON.stringify(c):''};
const deltaText=d=>{if(typeof d==='string')return d;if(Array.isArray(d))return d.map(x=>typeof x==='string'?x:(x?.text||'')).join('');if(d&&typeof d.text==='string')return d.text;return ''};
const randHex=n=>{const a=new Uint8Array(n);if(globalThis.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<n;i++)a[i]=Math.floor(Math.random()*256);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('')};
const randText=n=>{const m=Math.max(0,Math.min(4000,Math.floor(Number(n)||0)));if(m<=0)return'';return randHex(Math.ceil(m/2)).slice(0,m)};
const buildUserPrompt=(text,useRand,markerLen)=>{if(!useRand)return{prompt:text,tag:null,marker:null,markerLen:0};const tag='r'+randText(markerLen);const marker='[RANDOM_MARKER:'+tag+']';return{prompt:marker+text,tag,marker,markerLen:Math.max(0,Math.floor(Number(markerLen)||0))}};
const estimateTokens=text=>Math.max(1,Math.ceil(String(text||'').length/4));
const usageWithFallback=(usage,reqPrompt,sysPrompt,respText)=>{let p=Number(usage?.prompt_tokens||0),c=Number(usage?.completion_tokens||0),t=Number(usage?.total_tokens||0),estimated=false;if(p<=0&&c<=0&&t<=0){p=estimateTokens((sysPrompt?sysPrompt+'\n':'')+(reqPrompt||''));c=estimateTokens(respText||'');t=p+c;estimated=true}else{if(p<=0){p=estimateTokens((sysPrompt?sysPrompt+'\n':'')+(reqPrompt||''));estimated=true}if(c<=0){c=estimateTokens(respText||'');estimated=true}if(t<=0){t=p+c;estimated=true}}return{prompt_tokens:p,completion_tokens:c,total_tokens:t,estimated}};
const K='cpac.tokenConsumer.form';
const F=['base','token','modelAuto','sys','usr','loop','thr','max','temp','to','randOn','streamOn','ratioTarget'];
const getSaved=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}')}catch{return {}}};
const saveCfg=()=>{try{const d={};F.forEach(id=>{const el=$(id);if(el)d[id]=el.type==='checkbox'?el.checked:el.value});localStorage.setItem(K,JSON.stringify(d))}catch{}};
const loadCfg=()=>{const d=getSaved();F.forEach(id=>{const el=$(id);if(!el||d[id]===undefined)return;if(el.type==='checkbox')el.checked=(d[id]===true||d[id]==='true'||d[id]===1||d[id]==='1');else el.value=String(d[id])});if(d.modelAuto===undefined&&d.model!==undefined&&$('modelAuto'))$('modelAuto').value=String(d.model)};
const show=()=>{$('stt').textContent=S.st.t;$('std').textContent=S.st.d;$('str').textContent=`${S.st.s}/${S.st.f}/${S.st.a}`;$('stk').textContent=S.st.k;const pct=S.st.c>0?(S.st.p/S.st.c*100).toFixed(2):'0.00';$('stp').textContent=`${S.st.p}/${S.st.c} (${pct}%)`};
const ms=(t,c='')=>{$('ms').style.color=c||'#6b7280';$('ms').textContent=t};
const rs=(t,c='')=>{$('rs').style.color=c||'#6b7280';$('rs').textContent=t};
const btn=x=>{$('start').disabled=x;$('stop').disabled=!x;$('load').disabled=x};
const tm=()=>new Date().toLocaleTimeString('zh-CN',{hour12:false});
function mk(k){S.views.clear();const box=$('logs');box.innerHTML='';for(let i=1;i<=k;i++){const e=document.createElement('div');e.className='log waiting';e.innerHTML=`<div class="t"><span>线程 #${i}</span><span id="b${i}">等待</span></div><div class="m" id="m${i}">进度:0/0</div><pre id="l${i}">等待开始...</pre>`;box.appendChild(e);S.views.set(i,{el:e,b:$('b'+i),m:$('m'+i),l:$('l'+i)})}}
function up(i,st,pg,log){const v=S.views.get(i);if(!v)return;if(st){v.b.textContent=st;const cls=st==='等待'?'waiting':st==='运行中'||st==='流式中'||st==='请求中'?'running':st==='成功'?'success':st==='完成'?'done':st==='失败'?'error':st==='已停止'?'stopped':'waiting';v.el.className='log '+cls}if(pg)v.m.textContent='进度:'+pg;if(log)v.l.textContent=JSON.stringify(log,null,2)}
async function loadModels(){const b=$('base').value.trim(),t=$('token').value.trim();if(!b||!t){ms('请输入 baseurl + token','orange');return}ms('正在加载模型...','orange');$('load').disabled=true;try{const r=await fetch(api(b,'/models'),{headers:{Authorization:'Bearer '+t}});const raw=await r.text(),d=parse(raw);if(!r.ok)throw Error(d?.error?.message||('HTTP '+r.status));const ids=(Array.isArray(d?.data)?d.data:[]).map(x=>String(x.id||'').trim()).filter(Boolean).sort();const preferred=String($('modelAuto').value||'').trim();$('modelList').innerHTML='';if(!ids.length){$('modelAuto').value='';ms('模型列表为空','orange');return}ids.forEach(id=>{const o=document.createElement('option');o.value=id;$('modelList').appendChild(o)});if(preferred&&ids.includes(preferred))$('modelAuto').value=preferred;else if(!preferred)$('modelAuto').value=ids[0];ms('已加载 '+ids.length+' 个模型','#15803d')}catch(e){ms('加载模型失败: '+e.message,'#b91c1c')}finally{if(!S.run)$('load').disabled=false}}
async function streamOnce(c,onDelta,signal){const u=buildUserPrompt(c.usr,c.randOn,c.markerLen);const body={model:c.model,messages:[...(c.sys?[{role:'system',content:c.sys}]:[]),{role:'user',content:u.prompt}],max_tokens:c.max,temperature:c.temp,stream:true,stream_options:{include_usage:true}};const r=await fetch(api(c.base,'/chat/completions'),{method:'POST',headers:{Authorization:'Bearer '+c.token,'Content-Type':'application/json'},body:JSON.stringify(body),signal});if(!r.ok){const raw=await r.text(),d=parse(raw);throw Error(d?.error?.message||('HTTP '+r.status+' '+raw.slice(0,180)))}if(!r.body)throw Error('stream body is empty');const reader=r.body.getReader();const dec=new TextDecoder();let buf='',all='',usage={prompt_tokens:0,completion_tokens:0,total_tokens:0},finish_reason=null,done=false;while(!done){const {value,done:rd}=await reader.read();if(rd)break;buf+=dec.decode(value,{stream:true});const parts=buf.split('\n');buf=parts.pop()||'';for(const rawLine of parts){const line=rawLine.trim();if(!line||!line.startsWith('data:'))continue;const payload=line.slice(5).trim();if(payload==='[DONE]'){done=true;break}const j=parse(payload);if(!j)continue;if(j.error?.message)throw Error(j.error.message);if(j.usage)usage=j.usage;const ch=j.choices?.[0];if(ch?.finish_reason)finish_reason=ch.finish_reason;const d=deltaText(ch?.delta?.content);if(d){all+=d;if(onDelta)onDelta({latest:d,all,usage,finish_reason,tag:u.tag,marker:u.marker})}}}if(buf.trim().startsWith('data:')){const payload=buf.trim().slice(5).trim();if(payload&&payload!=='[DONE]'){const j=parse(payload);if(j?.usage)usage=j.usage;const ch=j?.choices?.[0];const d=deltaText(ch?.delta?.content);if(d){all+=d;if(onDelta)onDelta({latest:d,all,usage,finish_reason:ch?.finish_reason||finish_reason,tag:u.tag,marker:u.marker})}}}return{content:all,usage,finish_reason,tag:u.tag,marker:u.marker,prompt:u.prompt};}
async function requestOnce(c,signal){const u=buildUserPrompt(c.usr,c.randOn,c.markerLen);const body={model:c.model,messages:[...(c.sys?[{role:'system',content:c.sys}]:[]),{role:'user',content:u.prompt}],max_tokens:c.max,temperature:c.temp};const r=await fetch(api(c.base,'/chat/completions'),{method:'POST',headers:{Authorization:'Bearer '+c.token,'Content-Type':'application/json'},body:JSON.stringify(body),signal});if(!r.ok){const raw=await r.text(),d=parse(raw);throw Error(d?.error?.message||('HTTP '+r.status+' '+raw.slice(0,180)))}const d=parse(await r.text());if(d.error?.message)throw Error(d.error.message);const content=d?.choices?.[0]?.message?.content||'';const usage=d?.usage||{};return{content,usage,finish_reason:d?.choices?.[0]?.finish_reason||null,tag:u.tag,marker:u.marker,prompt:u.prompt};}
async function worker(i,c,id){for(let k=1;k<=c.loop;k++){if(S.stop||S.id!==id)break;up(i,'运行中',`${k}/${c.loop}`,{time:tm(),loop:k,status:c.streamOn?'streaming_start':'request_start',target_ratio:c.ratioTarget,marker_len:c.markerLen});const ac=new AbortController();S.cs.add(ac);const to=setTimeout(()=>ac.abort(),c.to);const t0=Date.now();let reqTag=null;try{let d;if(c.streamOn){d=await streamOnce(c,(ev)=>{reqTag=ev.tag||reqTag;up(i,'流式中',`${k}/${c.loop}`,{time:tm(),loop:k,status:'streaming',request_tag_len:(reqTag||'').length,latest_chunk:ev.latest,stream_chars:ev.all.length,message_preview:ev.all.slice(-1200)})},ac.signal)}else{d=await requestOnce(c,ac.signal);reqTag=d.tag;up(i,'请求中',`${k}/${c.loop}`,{time:tm(),loop:k,status:'requesting',request_tag_len:(reqTag||'').length})}const u=usageWithFallback(d.usage||{},d.prompt||c.usr,c.sys,d.content||''),p=u.prompt_tokens,cc=u.completion_tokens,kk=u.total_tokens;S.st.d++;S.st.s++;S.st.p+=p;S.st.c+=cc;S.st.k+=kk;const liveRatio=S.st.c>0?(S.st.p/S.st.c):0;S.ratio.live=liveRatio;if(c.randOn){const diff=liveRatio-c.ratioTarget;if(Math.abs(diff)>=0.02){const ratioStep=Math.max(1,Math.round(Math.abs(diff)*50));if(diff<0)c.markerLen=Math.min(4000,c.markerLen+ratioStep);else c.markerLen=Math.max(0,c.markerLen-ratioStep)}}S.ratio.markerLen=c.markerLen;show();up(i,'成功',`${k}/${c.loop}`,{time:tm(),loop:k,status:'success',request_tag_len:(d.tag||reqTag||'').length,ms:Date.now()-t0,usage:{prompt_tokens:p,completion_tokens:cc,total_tokens:kk,estimated:u.estimated},ratio:{target:c.ratioTarget,live:liveRatio,delta:liveRatio-c.ratioTarget,next_marker_len:c.markerLen},finish_reason:d.finish_reason||null,message_preview:(d.content||'').slice(-1200)})}catch(e){const ab=e?.name==='AbortError';S.st.d++;ab?S.st.a++:S.st.f++;show();up(i,ab?'已停止':'失败',`${k}/${c.loop}`,{time:tm(),loop:k,status:ab?'aborted':'error',error:ab?'request aborted (timeout or stop)':String(e.message||e)});if(ab&&S.stop)break}finally{clearTimeout(to);S.cs.delete(ac)}}up(i,S.stop?'已停止':'完成')}
async function start(){saveCfg();if(S.run)return;const c={base:$('base').value.trim(),token:$('token').value.trim(),modelAuto:$('modelAuto').value.trim(),model:$('modelAuto').value.trim(),sys:$('sys').value.trim(),usr:$('usr').value.trim(),loop:n($('loop').value,10,1,10000),thr:n($('thr').value,3,1,200),max:n($('max').value,1024,1,32768),temp:n($('temp').value,1,0,2),to:n($('to').value,120,5,600)*1000,randOn:$('randOn').checked,streamOn:$('streamOn').checked,ratioTarget:n($('ratioTarget').value,1,0.1,20),markerLen:24};if(!c.base||!c.token||!c.model){rs('Please fill base/token and choose or input model','#b91c1c');return}if(!c.usr){rs('User Prompt 不能为空','#b91c1c');return}S.run=true;S.stop=false;S.id++;S.start=Date.now();S.st={t:c.loop*c.thr,d:0,s:0,f:0,a:0,p:0,c:0,k:0};S.ratio={live:0,target:c.ratioTarget,markerLen:c.markerLen};show();btn(true);mk(c.thr);rs('运行中...','orange');if(S.timer)clearInterval(S.timer);S.timer=setInterval(()=>{$('sec').textContent=Math.floor((Date.now()-S.start)/1000)+'s'},500);await Promise.all(Array.from({length:c.thr},(_,x)=>worker(x+1,c,S.id)));if(!S.run)return;S.run=false;btn(false);clearInterval(S.timer);$('sec').textContent=Math.floor((Date.now()-S.start)/1000)+'s';rs(S.stop?'任务已停止':'任务完成',S.stop?'#a16207':'#15803d')}
function stop(){if(!S.run)return;S.stop=true;S.cs.forEach(c=>c.abort());rs('正在停止...','orange')}
let t=0;const auto=()=>{if(t)clearTimeout(t);t=setTimeout(()=>{if(!S.run)loadModels()},500)};
loadCfg();
$('base').addEventListener('input',auto);$('token').addEventListener('input',auto);$('base').addEventListener('change',saveCfg);$('token').addEventListener('change',saveCfg);$('modelAuto').addEventListener('input',saveCfg);$('modelAuto').addEventListener('change',saveCfg);$('randOn').addEventListener('change',saveCfg);$('streamOn').addEventListener('change',saveCfg);$('ratioTarget').addEventListener('change',saveCfg);$('tokenShow').addEventListener('change',()=>{$('token').type=$('tokenShow').checked?'text':'password'});$('load').onclick=()=>{saveCfg();loadModels()};$('start').onclick=start;$('stop').onclick=stop;show();if($('base').value.trim()&&$('token').value.trim())loadModels();
</script>
</body>
</html>
